<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="zari" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CA8A04"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <circle cx="300" cy="215" r="165" fill="#FDE68A" opacity="0.35"/>
  <!-- Draped Royal Blue Silk Saree -->
  <path d="M180 70 C240 55, 360 55, 420 70 L455 390 C360 415, 240 415, 145 390 Z" fill="url(#silk)"/>
  <!-- Pleats -->
  <path d="M250 130 L235 395 M285 125 L280 400 M320 125 L325 400 M355 130 L370 395" stroke="#1E40AF" stroke-width="4" opacity="0.7"/>
  <!-- Pallu diagonal drape -->
  <path d="M180 70 L415 245 L440 355 L165 170 Z" fill="#1E40AF" opacity="0.92"/>
  <!-- Gold Zari Border -->
  <path d="M145 372 C240 397, 360 397, 455 372 L455 392 C360 417, 240 417, 145 392 Z" fill="url(#zari)"/>
  <path d="M180 70 L415 245 L420 262 L175 88 Z" fill="url(#zari)"/>
  <text x="300" y="428" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#881337" letter-spacing="2">ROYAL BLUE SILK SAREE</text>
</svg>
